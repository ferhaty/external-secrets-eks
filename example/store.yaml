apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-secret-reader
  namespace: shop-secrets-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/shop-secrets-demo-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-checkout-token
  namespace: shop-secrets-demo
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["checkout-secret-reader"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-checkout-token
  namespace: shop-secrets-demo
subjects:
  - kind: ServiceAccount
    name: eso-shop
    namespace: eso-shop-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-checkout-token
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: checkout-aws
  namespace: shop-secrets-demo
spec:
  controller: shop-demo
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: checkout-secret-reader
