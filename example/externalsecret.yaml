apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkout-credentials
  namespace: shop-secrets-demo
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: checkout-aws
    kind: SecretStore
  target:
    name: checkout-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-1:111122223333:secret:shop/demo/checkout-AbCdEf
        property: apiKey
        version: AWSCURRENT
        decodingStrategy: None
